<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1100" width="100%" height="100%">
  <defs>
    <filter id="paper-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Paper background -->
  <rect x="0" y="0" width="850" height="1100" fill="#FCFAF2" stroke="#D1C7B7" stroke-width="2"/>
  <rect x="25" y="25" width="800" height="1050" fill="none" stroke="#2D4A3E" stroke-width="2"/>
  <rect x="29" y="29" width="792" height="1042" fill="none" stroke="#2D4A3E" stroke-width="0.8"/>

  <!-- Official Header -->
  <text x="425" y="65" font-family="'Times New Roman', serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1C382B">GOVERNMENT OF KERALA</text>
  <text x="425" y="85" font-family="'Times New Roman', serif" font-size="14" text-anchor="middle" fill="#2E4A3E">DEPARTMENT OF CIVIL SUPPLIES &amp; CONSUMER AFFAIRS</text>
  <text x="425" y="112" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#8B261D">APPLICATION FOR PRIORITY RATION CARD (സബ്‌സിഡി റേഷൻ കാർഡ് അപേക്ഷ)</text>
  <text x="425" y="130" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">Form No. CS-04B | National Food Security Act, 2013</text>
  <line x1="50" y1="145" x2="800" y2="145" stroke="#2D4A3E" stroke-width="1.5"/>

  <!-- Instructions Box -->
  <rect x="50" y="155" width="750" height="40" fill="#EBF2ED" stroke="#B0C8B7" stroke-width="1"/>
  <text x="65" y="172" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1C382B">നിർദ്ദേശങ്ങൾ (General Notice):</text>
  <text x="65" y="187" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">എല്ലാ വിവരങ്ങളും വ്യക്തമായി രേഖപ്പെടുത്തുക. അസത്യമായ വിവരങ്ങൾ നൽകുന്നത് ശിക്ഷാർഹമാണ്. (Fill details clearly.)</text>

  <!-- Photo Box -->
  <rect x="670" y="205" width="125" height="150" fill="#F4EFE6" stroke="#888888" stroke-dasharray="3,3"/>
  <text x="732" y="275" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#777777">Affix Family Photo</text>
  <text x="732" y="292" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#777777">(കുടുംബ ഫോട്ടോ)</text>

  <!-- Field 1: Applicant Name -->
  <g id="field-box-applicant_name">
    <text x="50" y="235" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1C382B">1. Head of Family Name:</text>
    <text x="50" y="252" font-family="Arial, sans-serif" font-size="11" fill="#444444">(കുടുംബനാഥന്റെ പേര്)</text>
    <rect x="270" y="222" width="380" height="34" fill="#FFFFFF" stroke="#8A9E94" stroke-width="1.5" rx="3"/>
    <text x="280" y="244" font-family="Courier, monospace" font-size="12" fill="#AAAAAA" id="preview-applicant_name">[ Blank Entry ]</text>
  </g>

  <!-- Field 2: Aadhaar Number -->
  <g id="field-box-aadhaar_number">
    <text x="50" y="300" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1C382B">2. Aadhaar Number:</text>
    <text x="50" y="317" font-family="Arial, sans-serif" font-size="11" fill="#444444">(12 അക്ക ആധാർ നമ്പർ)</text>
    <rect x="270" y="287" width="380" height="34" fill="#FFFFFF" stroke="#8A9E94" stroke-width="1.5" rx="3"/>
    <text x="280" y="309" font-family="Courier, monospace" font-size="12" fill="#AAAAAA" id="preview-aadhaar_number">[ 12-Digit UID ]</text>
  </g>

  <!-- Field 3: Family Members Count -->
  <g id="field-box-family_members_count">
    <text x="50" y="365" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1C382B">3. Total Family Members:</text>
    <text x="50" y="382" font-family="Arial, sans-serif" font-size="11" fill="#444444">(കുടുംബാംഗങ്ങളുടെ എണ്ണം)</text>
    <rect x="270" y="352" width="180" height="34" fill="#FFFFFF" stroke="#8A9E94" stroke-width="1.5" rx="3"/>
    <text x="280" y="374" font-family="Courier, monospace" font-size="12" fill="#AAAAAA" id="preview-family_members_count">[ Count ]</text>
  </g>

  <!-- Field 4: Annual Income -->
  <g id="field-box-annual_income">
    <text x="50" y="430" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1C382B">4. Annual Income (₹):</text>
    <text x="50" y="447" font-family="Arial, sans-serif" font-size="11" fill="#444444">(വാർഷിക വരുമാനം രൂപയിൽ)</text>
    <rect x="270" y="417" width="260" height="34" fill="#FFFFFF" stroke="#8A9E94" stroke-width="1.5" rx="3"/>
    <text x="280" y="439" font-family="Courier, monospace" font-size="12" fill="#AAAAAA" id="preview-annual_income">[ Amount ₹ ]</text>
  </g>

  <!-- Field 5: Residential Address -->
  <g id="field-box-residential_address">
    <text x="50" y="500" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1C382B">5. Residential Address:</text>
    <text x="50" y="517" font-family="Arial, sans-serif" font-size="11" fill="#444444">(മേൽവിലാസം, വാർഡ് &amp; പിൻകോഡ്)</text>
    <rect x="270" y="485" width="520" height="70" fill="#FFFFFF" stroke="#8A9E94" stroke-width="1.5" rx="3"/>
    <text x="280" y="512" font-family="Courier, monospace" font-size="12" fill="#AAAAAA" id="preview-residential_address">[ House Name, Locality, Ward, Post Office ]</text>
  </g>

  <!-- Field 6: Mobile Number -->
  <g id="field-box-mobile_number">
    <text x="50" y="605" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1C382B">6. Mobile Phone Number:</text>
    <text x="50" y="622" font-family="Arial, sans-serif" font-size="11" fill="#444444">(ബന്ധപ്പെടേണ്ട മൊബൈൽ നമ്പർ)</text>
    <rect x="270" y="592" width="300" height="34" fill="#FFFFFF" stroke="#8A9E94" stroke-width="1.5" rx="3"/>
    <text x="280" y="614" font-family="Courier, monospace" font-size="12" fill="#AAAAAA" id="preview-mobile_number">[ 10-Digit Mobile ]</text>
  </g>

  <!-- Field 7: Four Wheeler -->
  <g id="field-box-owns_four_wheeler">
    <text x="50" y="675" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1C382B">7. Owns 4-Wheeler Motor Car?</text>
    <text x="50" y="692" font-family="Arial, sans-serif" font-size="11" fill="#444444">(നാലുചക്ര വാഹനം സ്വന്തമായുണ്ടോ?)</text>
    <rect x="270" y="662" width="160" height="34" fill="#FFFFFF" stroke="#8A9E94" stroke-width="1.5" rx="3"/>
    <text x="280" y="684" font-family="Courier, monospace" font-size="12" fill="#AAAAAA" id="preview-owns_four_wheeler">[ Yes / No ]</text>
  </g>

  <!-- Verification Statement -->
  <rect x="50" y="760" width="750" height="150" fill="#F4EFE6" stroke="#D1C7B7" stroke-width="1"/>
  <text x="65" y="785" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1C382B">DECLARATION &amp; VERIFICATION (സത്യവാങ്മൂലം):</text>
  <text x="65" y="810" font-family="Arial, sans-serif" font-size="11" fill="#333333">മേൽ പ്രസ്താവിച്ച വിവരങ്ങൾ എന്റെ അറിവിലും വിശ്വാസത്തിലും പൂർണ്ണമായും സത്യമാണ്. ഇതിൽ യാതൊരു</text>
  <text x="65" y="828" font-family="Arial, sans-serif" font-size="11" fill="#333333">അസത്യവും ഉൾപ്പെടുത്തിയിട്ടില്ല എന്ന് ഞാൻ സാക്ഷ്യപ്പെടുത്തുന്നു. (I hereby declare that all particulars are true.)</text>

  <text x="80" y="885" font-family="Arial, sans-serif" font-size="12" fill="#555555">തീയതി (Date): ..........................</text>
  <text x="500" y="885" font-family="Arial, sans-serif" font-size="12" fill="#555555">അപേക്ഷകന്റെ ഒപ്പ് (Applicant Signature)</text>

  <!-- Official Stamp -->
  <circle cx="700" cy="980" r="45" fill="none" stroke="#2D4A3E" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="700" y="975" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2D4A3E">CIVIL SUPPLIES DEPT</text>
  <text x="700" y="990" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#2D4A3E">TALUK SUPPLY OFFICE</text>
</svg>
