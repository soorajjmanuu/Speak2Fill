<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1100" width="100%" height="100%">
  <!-- Background -->
  <rect x="0" y="0" width="850" height="1100" fill="#FAFBF7" stroke="#D3D9CF" stroke-width="2"/>
  <rect x="25" y="25" width="800" height="1050" fill="none" stroke="#234E52" stroke-width="2"/>

  <!-- Header -->
  <rect x="27" y="27" width="796" height="105" fill="#234E52"/>
  <text x="425" y="65" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DEPARTMENT OF SCHOOL EDUCATION</text>
  <text x="425" y="90" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#E6FFFA" text-anchor="middle">GOVERNMENT AIDED SECONDARY SCHOOL ADMISSION &amp; SCHOLARSHIP</text>
  <text x="425" y="112" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#FBD38D" text-anchor="middle">விண்ணப்பப் படிவம் (Admission Session 2026–2027)</text>

  <!-- Photo Box -->
  <rect x="670" y="180" width="125" height="150" fill="#F0FFF4" stroke="#234E52" stroke-dasharray="3,3"/>
  <text x="732" y="255" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#234E52">Affix Student</text>
  <text x="732" y="270" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#234E52">Passport Photo</text>

  <!-- Field 1: Student Name -->
  <g id="field-box-student_name">
    <text x="50" y="215" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D4044">1. Student Full Name (மாணவர் பெயர்):</text>
    <rect x="270" y="200" width="380" height="36" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5" rx="3"/>
    <text x="282" y="223" font-family="Courier, monospace" font-size="13" fill="#A0AEC0" id="preview-student_name">[ Student Name ]</text>
  </g>

  <!-- Field 2: Admission Grade -->
  <g id="field-box-admission_grade">
    <text x="50" y="285" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D4044">2. Grade Seeking Admission (வகுப்பு):</text>
    <rect x="270" y="270" width="200" height="36" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5" rx="3"/>
    <text x="282" y="293" font-family="Courier, monospace" font-size="13" fill="#A0AEC0" id="preview-admission_grade">[ Class / Std ]</text>
  </g>

  <!-- Field 3: Mother Tongue -->
  <g id="field-box-mother_tongue">
    <text x="50" y="355" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D4044">3. Mother Tongue (தாய்மொழி):</text>
    <rect x="270" y="340" width="240" height="36" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5" rx="3"/>
    <text x="282" y="363" font-family="Courier, monospace" font-size="13" fill="#A0AEC0" id="preview-mother_tongue">[ Language ]</text>
  </g>

  <!-- Field 4: Guardian Contact -->
  <g id="field-box-guardian_contact">
    <text x="50" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D4044">4. Parent / Guardian Mobile:</text>
    <rect x="270" y="410" width="280" height="36" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5" rx="3"/>
    <text x="282" y="433" font-family="Courier, monospace" font-size="13" fill="#A0AEC0" id="preview-guardian_contact">[ 10-Digit Mobile ]</text>
  </g>

  <!-- Field 5: Free School Bus -->
  <g id="field-box-requires_free_transport">
    <text x="50" y="495" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D4044">5. Needs School Transport Bus?</text>
    <rect x="270" y="480" width="180" height="36" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5" rx="3"/>
    <text x="282" y="503" font-family="Courier, monospace" font-size="13" fill="#A0AEC0" id="preview-requires_free_transport">[ Yes / No ]</text>
  </g>

  <!-- Parent Signature & Declaration -->
  <rect x="50" y="560" width="750" height="150" fill="#E6FFFA" stroke="#81E6D9" stroke-width="1"/>
  <text x="65" y="585" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#234E52">PARENT / GUARDIAN UNDERTAKING:</text>
  <text x="65" y="610" font-family="Arial, sans-serif" font-size="11" fill="#285E61">I hereby agree that my child will abide by school regulations. The statements made here are true.</text>
  <line x1="80" y1="675" x2="280" y2="675" stroke="#4FD1C5" stroke-width="1"/>
  <text x="80" y="692" font-family="Arial, sans-serif" font-size="11" fill="#285E61">Date of Application</text>
  <line x1="520" y1="675" x2="740" y2="675" stroke="#4FD1C5" stroke-width="1"/>
  <text x="520" y="692" font-family="Arial, sans-serif" font-size="11" fill="#285E61">Signature of Parent / Guardian</text>
</svg>
